name: sweethome3d-content
base: core26
version: "1.9.3"
summary: Furniture and texture libraries for Sweet Home 3D
description: |
    Additional 3D models and textures for Sweet Home 3D, distributed as
    SH3F (furniture) and SH3T (textures) library files from the official
    upstream collections.

    Included libraries:
      - 3DModels-Contributions 1.9.3 (Free Art License 1.3)
      - 3DModels-LucaPresidente 1.9.3 (Free Art License 1.3)
      - 3DModels-Scopia 1.9.3 (CC-BY 3.0)
      - Textures-Contributions 1.3.1 (CC-BY 4.0)
      - Textures-eTeksScopia 1.3.1 (CC-BY 4.0)

    Install alongside the sweethome3d-homedesign snap to make these
    libraries available to the application. The license texts of every
    library are shipped in the licenses/ directory and can be read with
    `sweethome3d-content.info`.

    This snap is a redistribution of official libraries downloaded from
    https://sourceforge.net/projects/sweethome3d/files/. Sweet Home 3D
    is (c) Space Mushrooms and distributed under the GNU GPL.

title: Sweet Home 3D Content Libraries
license: GPL-2.0 AND CC-BY-3.0 AND CC-BY-4.0
contact: https://github.com/jibel/sweethome3d-snap/issues
issues: https://github.com/jibel/sweethome3d-snap/issues
source-code: https://github.com/jibel/sweethome3d-snap
website: https://www.sweethome3d.com/

confinement: strict
grade: stable

# Content-provider slots: when this snap is installed, snapd exposes the
# library directories through these content interfaces.
slots:
  furniture:
    interface: content
    content: sweethome3d-furniture
    read: [$SNAP/furniture]
  textures:
    interface: content
    content: sweethome3d-textures
    read: [$SNAP/textures]

apps:
  info:
    command: bin/info

parts:
  libraries:
    plugin: dump
    source: .
    build-packages:
      - unzip
      - wget
    override-build: |
      set -eu
      chmod 755 "$SNAPCRAFT_PART_BUILD/snap/local/info"

      # The .sh3f/.sh3t library files are not committed to the repository.
      # The official upstream archives are downloaded at build time,
      # verified against pinned SHA-256 checksums, and extracted into
      # place. Already-extracted library files and checksum-valid local
      # copies of the archives are reused when present.
      CACHE="$(mktemp -d)"
      trap 'rm -rf "$CACHE"' EXIT

      fetch_library() {
        # $1 archive name, $2 archive path relative to the upstream
        # project, $3 expected sha256, $4 target directory, $5 library
        # file name
        local zip_name="$1" src_path="$2" sha256="$3" dir="$4" file="$5"
        local dest="$SNAPCRAFT_PART_BUILD/$dir/$file" zip="$CACHE/$zip_name"

        if [ -f "$dest" ]; then
          echo "Reusing extracted library $dir/$file"
          return
        fi

        for candidate in "$SNAPCRAFT_PART_BUILD/download/$zip_name" \
                         "$SNAPCRAFT_PART_BUILD/../download/contrib/$zip_name"; do
          if [ -f "$candidate" ] && \
             printf '%s  %s\n' "$sha256" "$candidate" | sha256sum --check --status 2>/dev/null; then
            echo "Reusing local archive $candidate"
            cp "$candidate" "$zip"
            break
          fi
        done

        if [ ! -f "$zip" ]; then
          url="https://sourceforge.net/projects/sweethome3d/files/$src_path/download"
          echo "Downloading $url"
          wget -q -O "$zip.part" "$url"
          printf '%s  %s\n' "$sha256" "$zip.part" | sha256sum --check -
          mv "$zip.part" "$zip"
        fi

        unzip -o -j -q "$zip" "$file" -d "$CACHE"
        install -D -m 644 "$CACHE/$file" "$dest"
      }

      fetch_library \
        3DModels-Contributions-1.9.3.zip \
        SweetHome3D-models/3DModels-1.9.3/3DModels-Contributions-1.9.3.zip \
        ded86e784ef4b732a4bcb7a9a213039b5ece57abdd8a89a22a377a7053ebbc9c \
        furniture Contributions.sh3f
      fetch_library \
        3DModels-LucaPresidente-1.9.3.zip \
        SweetHome3D-models/3DModels-1.9.3/3DModels-LucaPresidente-1.9.3.zip \
        1372bfbbd8c0ee8c0866676141ed75290456481e09a68eaa32bbbe197f4e43bc \
        furniture LucaPresidente.sh3f
      fetch_library \
        3DModels-Scopia-1.9.3.zip \
        SweetHome3D-models/3DModels-1.9.3/3DModels-Scopia-1.9.3.zip \
        29e88abface52aa47fda3e37012f22f13dc6c403eef3ed0f622b3d4d49d3fdaf \
        furniture Scopia.sh3f
      fetch_library \
        Textures-Contributions-1.3.1.zip \
        SweetHome3D-textures/Textures-1.3.1/Textures-Contributions-1.3.1.zip \
        a098431037b9c29d761720212bec0cda2b7a59911a72adeb5fb8ff9bc580eaef \
        textures Contributions.sh3t
      fetch_library \
        Textures-eTeksScopia-1.3.1.zip \
        SweetHome3D-textures/Textures-1.3.1/Textures-eTeksScopia-1.3.1.zip \
        391e84e16d45a0cf8aaa50a0791b2f356355007cd44e0c2c789c543fe5d7eb84 \
        textures eTeksScopia.sh3t

      craftctl default
      install -D -m 755 "$SNAPCRAFT_PART_BUILD/snap/local/info" \
        "$SNAPCRAFT_PART_INSTALL/bin/info"
